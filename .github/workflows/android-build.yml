name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - playback-test

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ellaApplicationId: ${{ inputs.build_type == 'playback-test' && 'com.ella.music.playbackfix' || 'com.ella.music' }}

    steps:
      - name: Checkout Halcyon
        uses: actions/checkout@v4

      - name: Check application license provenance
        run: python3 tools/check_licenses.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify online playlist playback
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest -PellaAbi=arm64-v8a \
            --tests 'com.ella.music.player.OnlinePlaybackUriTest' \
            --tests 'com.ella.music.data.OnlineResolvingDataSourceTest' \
            --tests 'com.ella.music.player.PlaybackErrorRecovery*Test' \
            --tests 'com.ella.music.player.PlaybackQueue*Test' \
            --tests 'com.ella.music.player.LocalCast*Test' \
            --tests 'com.ella.music.data.PcmWaveformScannerTest' \
            --tests 'com.ella.music.data.lx.LxOnlineServicePolicyTest' \
            --tests 'com.ella.music.data.musicfree.MusicFreeImportTest' \
            --stacktrace

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon :app:assembleDebug -PellaAbi=arm64-v8a --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a --stacktrace

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;
          find app/build/outputs/renamed-apk -type f -name "*.APK" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-${{ inputs.build_type || 'debug' }}-arm64-v8a-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Upload playback test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-tests-${{ inputs.build_type || 'debug' }}-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
